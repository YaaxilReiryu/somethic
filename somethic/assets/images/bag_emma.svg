<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEmma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F4ECE5"/>
    </linearGradient>
    <linearGradient id="cremeLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E5DC"/>
      <stop offset="100%" stop-color="#DBC5B8"/>
    </linearGradient>
    <linearGradient id="goldEmma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D98D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7734"/>
    </linearGradient>
    <filter id="shadowEmma" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2D2926" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgEmma)" rx="16"/>
  <!-- Shoulder Strap -->
  <path d="M 120 200 C 120 110, 280 110, 280 200" fill="none" stroke="#B89F90" stroke-width="12" stroke-linecap="round"/>
  <!-- Baguette Oblong Body -->
  <rect x="90" y="195" width="220" height="115" rx="28" fill="url(#cremeLeather)" filter="url(#shadowEmma)"/>
  <!-- Curved Flap -->
  <path d="M 90 220 Q 200 255 310 220 L 310 195 L 90 195 Z" fill="#E2D0C3"/>
  <!-- Hardware Buckle -->
  <rect x="185" y="222" width="30" height="16" rx="4" fill="url(#goldEmma)"/>
  <rect x="193" y="226" width="14" height="8" rx="2" fill="#2D2926"/>
  <text x="200" y="360" font-family="'Playfair Display', serif" font-size="12" fill="#8E867E" text-anchor="middle" letter-spacing="3">SOMETHIC • EMMA BAGUETTE</text>
</svg>

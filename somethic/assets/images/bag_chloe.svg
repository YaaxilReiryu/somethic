<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChloe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EFE8E2"/>
    </linearGradient>
    <linearGradient id="oliveLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555A4B"/>
      <stop offset="100%" stop-color="#3B4032"/>
    </linearGradient>
    <linearGradient id="goldChloe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D98D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7734"/>
    </linearGradient>
    <filter id="shadowChloe" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#2D2926" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgChloe)" rx="16"/>
  <!-- Tall Slender Handles -->
  <path d="M 150 170 C 150 70, 190 70, 190 170" fill="none" stroke="#2B2F24" stroke-width="8" stroke-linecap="round"/>
  <path d="M 210 170 C 210 70, 250 70, 250 170" fill="none" stroke="#2B2F24" stroke-width="8" stroke-linecap="round"/>
  <!-- Tote Body with Side Flare -->
  <polygon points="120,165 280,165 310,320 90,320" fill="url(#oliveLeather)" filter="url(#shadowChloe)"/>
  <!-- Center Accent Seam -->
  <line x1="200" y1="165" x2="200" y2="320" stroke="#2B2F24" stroke-width="2"/>
  <!-- Metallic Clasp -->
  <circle cx="200" cy="190" r="8" fill="url(#goldChloe)"/>
  <text x="200" y="360" font-family="'Playfair Display', serif" font-size="12" fill="#8E867E" text-anchor="middle" letter-spacing="3">SOMETHIC • CHLOE TOTE</text>
</svg>

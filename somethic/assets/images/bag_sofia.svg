<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSofia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F2EDE8"/>
    </linearGradient>
    <linearGradient id="burgundyLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E2639"/>
      <stop offset="100%" stop-color="#4C1423"/>
    </linearGradient>
    <linearGradient id="goldSofia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D98D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7734"/>
    </linearGradient>
    <filter id="shadowSofia" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2D2926" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgSofia)" rx="16"/>
  <!-- Top Handle -->
  <path d="M 160 170 C 160 100, 240 100, 240 170" fill="none" stroke="#380C17" stroke-width="12" stroke-linecap="round"/>
  <!-- Satchel Body -->
  <polygon points="110,170 290,170 305,315 95,315" fill="url(#burgundyLeather)" filter="url(#shadowSofia)"/>
  <!-- Top Bar & Clasp -->
  <rect x="105" y="166" width="190" height="10" rx="3" fill="#380C17"/>
  <rect x="188" y="185" width="24" height="28" rx="4" fill="url(#goldSofia)"/>
  <circle cx="200" cy="200" r="4" fill="#380C17"/>
  <!-- Bottom Protective Studs -->
  <circle cx="120" cy="318" r="3" fill="url(#goldSofia)"/>
  <circle cx="280" cy="318" r="3" fill="url(#goldSofia)"/>
  <text x="200" y="360" font-family="'Playfair Display', serif" font-size="12" fill="#8E867E" text-anchor="middle" letter-spacing="3">SOMETHIC • SOFIA SATCHEL</text>
</svg>

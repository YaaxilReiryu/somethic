<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLily" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#F2ECE6"/>
    </linearGradient>
    <linearGradient id="camelLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE8B63"/>
      <stop offset="100%" stop-color="#9A6943"/>
    </linearGradient>
    <linearGradient id="goldLily" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D98D"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7734"/>
    </linearGradient>
    <filter id="shadowLily" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2D2926" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#bgLily)" rx="16"/>
  <!-- Gold Chain Strap -->
  <path d="M 90 60 Q 90 190 120 195" fill="none" stroke="url(#goldLily)" stroke-width="6" stroke-dasharray="6,4"/>
  <path d="M 310 60 Q 310 190 280 195" fill="none" stroke="url(#goldLily)" stroke-width="6" stroke-dasharray="6,4"/>
  <!-- Bag Body with Quilted Pattern -->
  <rect x="100" y="185" width="200" height="130" rx="14" fill="url(#camelLeather)" filter="url(#shadowLily)"/>
  <!-- Quilted Diamond Stitches -->
  <g stroke="#7D5130" stroke-width="1.2" opacity="0.6">
    <line x1="120" y1="185" x2="220" y2="285"/>
    <line x1="160" y1="185" x2="260" y2="285"/>
    <line x1="200" y1="185" x2="300" y2="285"/>
    <line x1="280" y1="185" x2="180" y2="285"/>
    <line x1="240" y1="185" x2="140" y2="285"/>
    <line x1="200" y1="185" x2="100" y2="285"/>
  </g>
  <!-- Gold Logo Lock -->
  <circle cx="200" cy="240" r="14" fill="url(#goldLily)"/>
  <text x="200" y="245" font-family="'Playfair Display', serif" font-size="11" fill="#2D2926" text-anchor="middle" font-weight="bold">S</text>
  <text x="200" y="360" font-family="'Playfair Display', serif" font-size="12" fill="#8E867E" text-anchor="middle" letter-spacing="3">SOMETHIC • LILY QUILTED</text>
</svg>
